# Docs for the Azure Web Apps Deploy action: https://github.com
# More GitHub Actions for Azure: https://github.com

name: Build and deploy ASP.Net Core app to Azure Web App - LUNALIA-SPACE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build with dotnet
        run: dotnet build SchoolJournal.Api/SchoolJournal.Api.csproj --configuration Release /p:NoWarn=1591

      - name: dotnet publish
        run: dotnet publish SchoolJournal.Api/SchoolJournal.Api.csproj -c Release -o publish /p:NoWarn=1591

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C0CC631F9D67409485102DECABF4C4DF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C668D541297A412BB5A7C2745351D30A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5EAE437E76C543AD82C7DD9749C0EE08 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'LUNALIA-SPACE'
          slot-name: 'Production'
          package: .
